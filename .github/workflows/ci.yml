name: Kubernetes CI & Security Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl & Kustomize
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Kustomize Builds
        run: |
          kubectl kustomize base > /dev/null
          kubectl kustomize overlays/dev > /dev/null
          kubectl kustomize overlays/prod > /dev/null

      - name: Run Manifest Security Verification Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
